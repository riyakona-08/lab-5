# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Riya Kona's Website"                                # Riya Kona
  description: "Biology student at Case Western Reserve University with interests in dentistry and oral microbiology."  
  image: img/IMG_9660.jpg
  
  favicon: img/favicon.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
 
    
    # your sub-pages
    left:
      - text: "Home"
        href: index.qmd
      - text: "Research & Projects"
        href: projects/index.qmd
      - text: "Experience"
        href: Experience/index.qmd
      - text: "CV"
        href: cv/index.qmd
    
    # your social media handles
    right:
      - icon: instagram
        aria-label: "Instagram"
        href: https://www.instagram.com/riyakona_08/
      - icon: envelope
        aria-label: "Email Riya"
        href: "mailto:rxk836@case.edu" 
  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
  page-footer: 
    left: |
      <span class="faux-block">&#169; 2023 Marvin Schmitt CC BY-SA 4.0</span>
    center: |
      <span class="faux-block"><a href="https://www.marvinschmitt.com/blog/website-tutorial-quarto/">View the tutorial for this template!</a></span>
    right: |
      <span class="faux-block"><a href="https://github.com/marvinschmitt/quarto-website-template/">View source on GitHub</a></span>

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme: 
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true